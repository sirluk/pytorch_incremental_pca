[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-incremental-pca"
version = "0.1.0"
authors = [
  { name="Lukas Hauzenberger", email="lukas.hauzenberger@gmail.com" },
]
description = "Incremental PCA on GPU: a PyTorch implementation of scikit-learn-style IncrementalPCA for CUDA and CPU"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch"]

keywords = [
    "incremental-pca",
    "pca",
    "principal-component-analysis",
    "gpu",
    "cuda",
    "pytorch",
    "torch",
    "dimensionality-reduction",
    "svd",
    "truncated-svd",
    "out-of-core",
    "streaming",
    "scikit-learn",
    "machine-learning",
    "unsupervised-learning",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/sirluk/pytorch_incremental_pca"
Repository = "https://github.com/sirluk/pytorch_incremental_pca"
Issues = "https://github.com/sirluk/pytorch_incremental_pca/issues"
Benchmarks = "https://github.com/sirluk/pytorch_incremental_pca/blob/main/benchmarks/results/README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pre-commit>=3.5.0",
    "black>=23.1.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "scikit-learn"
]
